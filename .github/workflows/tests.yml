name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python build_plugin.py --check
      - run: python -m unittest -q
        env:
          FIGMA_AUTO_RAISE: '0'
          PYTHONWARNINGS: ignore
      - run: node --test tests/test_connection.mjs
